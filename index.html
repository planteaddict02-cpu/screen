<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Vidéo Pro - Enregistrer, Monter, Créer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // Icônes SVG
        const Monitor = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
        );
        
        const Film = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
                <line x1="7" y1="2" x2="7" y2="22"/>
                <line x1="17" y1="2" x2="17" y2="22"/>
            </svg>
        );
        
        const Wand = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/>
            </svg>
        );
        
        const Download = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
        );

        const Square = ({ className }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            </svg>
        );

        const Play = ({ className }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
        );

        const Pause = ({ className }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
                <rect x="6" y="4" width="4" height="16"/>
                <rect x="14" y="4" width="4" height="16"/>
            </svg>
        );

        const Hash = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <line x1="4" y1="9" x2="20" y2="9"/>
                <line x1="4" y1="15" x2="20" y2="15"/>
                <line x1="10" y1="3" x2="8" y2="21"/>
                <line x1="16" y1="3" x2="14" y2="21"/>
            </svg>
        );

        function VideoStudio() {
            const [activeTab, setActiveTab] = useState('record'); // record, edit, effects, export
            const [recording, setRecording] = useState(false);
            const [paused, setPaused] = useState(false);
            const [videoUrl, setVideoUrl] = useState(null);
            const [duration, setDuration] = useState(0);
            const [recordedChunks, setRecordedChunks] = useState([]);
            
            // Paramètres d'enregistrement
            const [micEnabled, setMicEnabled] = useState(true);
            const [systemAudioEnabled, setSystemAudioEnabled] = useState(true);
            
            // Paramètres d'édition
            const [videoTitle, setVideoTitle] = useState('');
            const [textOverlay, setTextOverlay] = useState('');
            const [selectedFilter, setSelectedFilter] = useState('none');
            const [brightness, setBrightness] = useState(100);
            const [contrast, setContrast] = useState(100);
            const [saturation, setSaturation] = useState(100);
            
            const mediaRecorderRef = useRef(null);
            const timerRef = useRef(null);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);

            useEffect(() => {
                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                    if (videoUrl) URL.revokeObjectURL(videoUrl);
                };
            }, [videoUrl]);

            // ENREGISTREMENT
            const startRecording = async () => {
                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { mediaSource: 'screen' },
                        audio: systemAudioEnabled
                    });

                    let audioStream = null;
                    if (micEnabled) {
                        try {
                            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        } catch (err) {
                            console.log('Microphone non accessible:', err);
                        }
                    }

                    const tracks = [...screenStream.getTracks()];
                    if (audioStream) tracks.push(...audioStream.getTracks());

                    const combinedStream = new MediaStream(tracks);
                    const options = { mimeType: 'video/webm;codecs=vp9' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options.mimeType = 'video/webm';
                    }

                    const mediaRecorder = new MediaRecorder(combinedStream, options);
                    mediaRecorderRef.current = mediaRecorder;

                    const chunks = [];
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) chunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        setVideoUrl(url);
                        setRecordedChunks(chunks);
                        tracks.forEach(track => track.stop());
                        if (timerRef.current) clearInterval(timerRef.current);
                        setActiveTab('edit');
                    };

                    screenStream.getVideoTracks()[0].onended = () => stopRecording();

                    mediaRecorder.start(100);
                    setRecording(true);
                    setPaused(false);
                    setDuration(0);

                    timerRef.current = setInterval(() => setDuration(d => d + 1), 1000);
                } catch (err) {
                    console.error('Erreur:', err);
                    alert('Impossible de démarrer l\'enregistrement');
                }
            };

            const pauseRecording = () => {
                if (mediaRecorderRef.current && recording) {
                    if (paused) {
                        mediaRecorderRef.current.resume();
                        timerRef.current = setInterval(() => setDuration(d => d + 1), 1000);
                    } else {
                        mediaRecorderRef.current.pause();
                        if (timerRef.current) clearInterval(timerRef.current);
                    }
                    setPaused(!paused);
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && recording) {
                    mediaRecorderRef.current.stop();
                    setRecording(false);
                    setPaused(false);
                    if (timerRef.current) clearInterval(timerRef.current);
                }
            };

            // FILTRES
            const filters = {
                none: '',
                vintage: 'sepia(50%) contrast(110%)',
                bw: 'grayscale(100%)',
                vivid: 'saturate(150%) contrast(110%)',
                cool: 'hue-rotate(180deg) saturate(120%)',
                warm: 'hue-rotate(20deg) saturate(120%)',
                dramatic: 'contrast(150%) brightness(90%)',
            };

            const getFilterStyle = () => {
                const baseFilter = filters[selectedFilter] || '';
                const customFilters = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%)`;
                return baseFilter ? `${baseFilter} ${customFilters}` : customFilters;
            };

            // HASHTAGS
            const hashtags = [
                '#Montage', '#VideoEdit', '#ContentCreator', '#TikTok', '#Reels',
                '#YouTubeShorts', '#ViralVideo', '#Edit', '#VideoMaker', '#Creative',
                '#MusicVideo', '#Trending', '#FYP', '#LaSmala', '#Elsa',
                '#Annees90', '#Nostalgie', '#FilmFrancais', '#HumourFrancais'
            ];

            const copyHashtags = () => {
                navigator.clipboard.writeText(hashtags.join(' '));
                alert('✅ Hashtags copiés !');
            };

            // TÉLÉCHARGEMENT
            const downloadVideo = async () => {
                if (videoUrl) {
                    try {
                        const a = document.createElement('a');
                        a.href = videoUrl;
                        a.download = `${videoTitle || 'montage'}-${Date.now()}.webm`;
                        a.click();
                        alert('✅ Vidéo téléchargée !');
                    } catch (err) {
                        console.error('Erreur:', err);
                    }
                }
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 p-4">
                    <div className="max-w-7xl mx-auto">
                        {/* HEADER */}
                        <div className="text-center mb-8">
                            <h1 className="text-5xl font-bold text-white mb-2 flex items-center justify-center gap-3">
                                <Film className="w-12 h-12" />
                                Studio Vidéo Pro
                            </h1>
                            <p className="text-white/70">Enregistrez • Montez • Ajoutez des effets • Exportez</p>
                        </div>

                        {/* NAVIGATION TABS */}
                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-2 mb-6 flex gap-2">
                            <button
                                onClick={() => setActiveTab('record')}
                                className={`flex-1 py-3 px-6 rounded-xl font-semibold transition-all flex items-center justify-center gap-2 ${
                                    activeTab === 'record' 
                                        ? 'bg-red-500 text-white shadow-lg' 
                                        : 'text-white/70 hover:bg-white/5'
                                }`}
                            >
                                <Monitor className="w-5 h-5" />
                                Enregistrer
                            </button>
                            <button
                                onClick={() => setActiveTab('edit')}
                                disabled={!videoUrl}
                                className={`flex-1 py-3 px-6 rounded-xl font-semibold transition-all flex items-center justify-center gap-2 ${
                                    activeTab === 'edit' 
                                        ? 'bg-blue-500 text-white shadow-lg' 
                                        : videoUrl ? 'text-white/70 hover:bg-white/5' : 'text-white/30 cursor-not-allowed'
                                }`}
                            >
                                <Film className="w-5 h-5" />
                                Montage
                            </button>
                            <button
                                onClick={() => setActiveTab('effects')}
                                disabled={!videoUrl}
                                className={`flex-1 py-3 px-6 rounded-xl font-semibold transition-all flex items-center justify-center gap-2 ${
                                    activeTab === 'effects' 
                                        ? 'bg-purple-500 text-white shadow-lg' 
                                        : videoUrl ? 'text-white/70 hover:bg-white/5' : 'text-white/30 cursor-not-allowed'
                                }`}
                            >
                                <Wand className="w-5 h-5" />
                                Effets
                            </button>
                            <button
                                onClick={() => setActiveTab('export')}
                                disabled={!videoUrl}
                                className={`flex-1 py-3 px-6 rounded-xl font-semibold transition-all flex items-center justify-center gap-2 ${
                                    activeTab === 'export' 
                                        ? 'bg-green-500 text-white shadow-lg' 
                                        : videoUrl ? 'text-white/70 hover:bg-white/5' : 'text-white/30 cursor-not-allowed'
                                }`}
                            >
                                <Download className="w-5 h-5" />
                                Exporter
                            </button>
                        </div>

                        {/* CONTENT */}
                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-8 border border-white/20">
                            
                            {/* ENREGISTREMENT TAB */}
                            {activeTab === 'record' && (
                                <div>
                                    <h2 className="text-3xl font-bold text-white mb-6 flex items-center gap-3">
                                        <Monitor className="w-8 h-8" />
                                        Enregistrement d'écran
                                    </h2>

                                    {!recording && !videoUrl && (
                                        <div className="space-y-4 mb-8">
                                            <div className="bg-white/5 p-4 rounded-xl flex items-center gap-3">
                                                <input
                                                    type="checkbox"
                                                    id="sys"
                                                    checked={systemAudioEnabled}
                                                    onChange={(e) => setSystemAudioEnabled(e.target.checked)}
                                                    className="w-5 h-5"
                                                />
                                                <label htmlFor="sys" className="text-white cursor-pointer flex-1">
                                                    🔊 Son du système (musique, audio des vidéos)
                                                </label>
                                            </div>
                                            <div className="bg-white/5 p-4 rounded-xl flex items-center gap-3">
                                                <input
                                                    type="checkbox"
                                                    id="mic"
                                                    checked={micEnabled}
                                                    onChange={(e) => setMicEnabled(e.target.checked)}
                                                    className="w-5 h-5"
                                                />
                                                <label htmlFor="mic" className="text-white cursor-pointer flex-1">
                                                    🎤 Microphone (voix-off, commentaires)
                                                </label>
                                            </div>
                                        </div>
                                    )}

                                    {recording && (
                                        <div className="text-center mb-8">
                                            <div className="inline-flex items-center gap-4 bg-red-500/20 border-2 border-red-500 rounded-full px-8 py-4">
                                                <div className="w-4 h-4 bg-red-500 rounded-full animate-pulse"></div>
                                                <span className="text-white text-3xl font-mono font-bold">
                                                    {formatTime(duration)}
                                                </span>
                                            </div>
                                            {paused && <p className="text-yellow-300 mt-3">⏸️ En pause</p>}
                                        </div>
                                    )}

                                    <div className="flex gap-4 justify-center">
                                        {!recording && !videoUrl && (
                                            <button
                                                onClick={startRecording}
                                                className="bg-red-500 hover:bg-red-600 text-white px-12 py-5 rounded-full text-xl font-bold shadow-2xl transform hover:scale-105 transition-all"
                                            >
                                                🎬 Démarrer l'enregistrement
                                            </button>
                                        )}

                                        {recording && (
                                            <>
                                                <button
                                                    onClick={pauseRecording}
                                                    className="bg-yellow-500 hover:bg-yellow-600 text-white px-8 py-4 rounded-full font-bold shadow-lg transform hover:scale-105 transition-all flex items-center gap-2"
                                                >
                                                    {paused ? <Play className="w-6 h-6" /> : <Pause className="w-6 h-6" />}
                                                    {paused ? 'Reprendre' : 'Pause'}
                                                </button>
                                                <button
                                                    onClick={stopRecording}
                                                    className="bg-gray-700 hover:bg-gray-800 text-white px-8 py-4 rounded-full font-bold shadow-lg transform hover:scale-105 transition-all flex items-center gap-2"
                                                >
                                                    <Square className="w-6 h-6" />
                                                    Arrêter
                                                </button>
                                            </>
                                        )}
                                    </div>

                                    {!videoUrl && !recording && (
                                        <div className="mt-8 bg-gradient-to-r from-blue-500/20 to-purple-500/20 rounded-xl p-6 border border-blue-500/30">
                                            <h3 className="text-white font-bold mb-3">💡 Conseils Pro</h3>
                                            <ul className="text-white/90 space-y-2 text-sm">
                                                <li>• Testez votre audio avant l'enregistrement</li>
                                                <li>• Fermez les applications inutiles pour de meilleures performances</li>
                                                <li>• Utilisez la pause pour structurer votre contenu</li>
                                                <li>• Le format WebM est compatible avec tous les éditeurs</li>
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* MONTAGE TAB */}
                            {activeTab === 'edit' && videoUrl && (
                                <div>
                                    <h2 className="text-3xl font-bold text-white mb-6 flex items-center gap-3">
                                        <Film className="w-8 h-8" />
                                        Montage vidéo
                                    </h2>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div>
                                            <div className="bg-black rounded-xl overflow-hidden mb-4">
                                                <video
                                                    ref={videoRef}
                                                    src={videoUrl}
                                                    controls
                                                    className="w-full"
                                                    style={{ filter: getFilterStyle() }}
                                                />
                                            </div>
                                            <p className="text-white/70 text-center text-sm">
                                                Durée: {formatTime(duration)}
                                            </p>
                                        </div>

                                        <div className="space-y-4">
                                            <div className="bg-white/5 rounded-xl p-4">
                                                <label className="text-white font-semibold block mb-2">📝 Titre de la vidéo</label>
                                                <input
                                                    type="text"
                                                    value={videoTitle}
                                                    onChange={(e) => setVideoTitle(e.target.value)}
                                                    placeholder="Mon super montage..."
                                                    className="w-full px-4 py-3 rounded-lg bg-white/10 text-white border border-white/20 focus:border-purple-500 outline-none"
                                                />
                                            </div>

                                            <div className="bg-white/5 rounded-xl p-4">
                                                <label className="text-white font-semibold block mb-2">✍️ Texte sur la vidéo</label>
                                                <input
                                                    type="text"
                                                    value={textOverlay}
                                                    onChange={(e) => setTextOverlay(e.target.value)}
                                                    placeholder="Ajoutez du texte..."
                                                    className="w-full px-4 py-3 rounded-lg bg-white/10 text-white border border-white/20 focus:border-purple-500 outline-none"
                                                />
                                                {textOverlay && (
                                                    <div className="mt-3 p-3 bg-black/30 rounded text-white text-center font-bold text-xl">
                                                        {textOverlay}
                                                    </div>
                                                )}
                                            </div>

                                            <div className="bg-gradient-to-r from-purple-500/20 to-pink-500/20 rounded-xl p-4 border border-purple-500/30">
                                                <p className="text-white font-semibold mb-2">🎯 Prochaines étapes</p>
                                                <p className="text-white/80 text-sm">
                                                    Allez dans l'onglet "Effets" pour ajouter des filtres et ajuster les couleurs !
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* EFFETS TAB */}
                            {activeTab === 'effects' && videoUrl && (
                                <div>
                                    <h2 className="text-3xl font-bold text-white mb-6 flex items-center gap-3">
                                        <Wand className="w-8 h-8" />
                                        Effets visuels
                                    </h2>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div>
                                            <div className="bg-black rounded-xl overflow-hidden">
                                                <video
                                                    src={videoUrl}
                                                    controls
                                                    className="w-full"
                                                    style={{ filter: getFilterStyle() }}
                                                />
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            {/* FILTRES PRESETS */}
                                            <div className="bg-white/5 rounded-xl p-4">
                                                <label className="text-white font-semibold block mb-3">🎨 Filtres</label>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {Object.keys(filters).map(filter => (
                                                        <button
                                                            key={filter}
                                                            onClick={() => setSelectedFilter(filter)}
                                                            className={`px-4 py-3 rounded-lg font-semibold transition-all ${
                                                                selectedFilter === filter
                                                                    ? 'bg-purple-500 text-white shadow-lg'
                                                                    : 'bg-white/10 text-white/70 hover:bg-white/20'
                                                            }`}
                                                        >
                                                            {filter === 'none' ? 'Original' : 
                                                             filter === 'bw' ? 'Noir & Blanc' :
                                                             filter === 'vivid' ? 'Vivide' :
                                                             filter === 'cool' ? 'Froid' :
                                                             filter === 'warm' ? 'Chaud' :
                                                             filter === 'dramatic' ? 'Dramatique' :
                                                             'Vintage'}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* REGLAGES MANUELS */}
                                            <div className="bg-white/5 rounded-xl p-4 space-y-4">
                                                <div>
                                                    <label className="text-white text-sm font-semibold block mb-2">
                                                        ☀️ Luminosité: {brightness}%
                                                    </label>
                                                    <input
                                                        type="range"
                                                        min="50"
                                                        max="150"
                                                        value={brightness}
                                                        onChange={(e) => setBrightness(e.target.value)}
                                                        className="w-full"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="text-white text-sm font-semibold block mb-2">
                                                        🎭 Contraste: {contrast}%
                                                    </label>
                                                    <input
                                                        type="range"
                                                        min="50"
                                                        max="150"
                                                        value={contrast}
                                                        onChange={(e) => setContrast(e.target.value)}
                                                        className="w-full"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="text-white text-sm font-semibold block mb-2">
                                                        🌈 Saturation: {saturation}%
                                                    </label>
                                                    <input
                                                        type="range"
                                                        min="0"
                                                        max="200"
                                                        value={saturation}
                                                        onChange={(e) => setSaturation(e.target.value)}
                                                        className="w-full"
                                                    />
                                                </div>

                                                <button
                                                    onClick={() => {
                                                        setSelectedFilter('none');
                                                        setBrightness(100);
                                                        setContrast(100);
                                                        setSaturation(100);
                                                    }}
                                                    className="w-full bg-gray-600 hover:bg-gray-700 text-white py-2 rounded-lg font-semibold transition-all"
                                                >
                                                    🔄 Réinitialiser
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* EXPORT TAB */}
                            {activeTab === 'export' && videoUrl && (
                                <div>
                                    <h2 className="text-3xl font-bold text-white mb-6 flex items-center gap-3">
                                        <Download className="w-8 h-8" />
                                        Exporter & Partager
                                    </h2>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div>
                                            <div className="bg-black rounded-xl overflow-hidden mb-4">
                                                <video
                                                    src={videoUrl}
                                                    controls
                                                    className="w-full"
                                                    style={{ filter: getFilterStyle() }}
                                                />
                                            </div>
                                            
                                            <button
                                                onClick={downloadVideo}
                                                className="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg transform hover:scale-105 transition-all flex items-center justify-center gap-2"
                                            >
                                                <Download className="w-6 h-6" />
                                                💾 Télécharger la vidéo
                                            </button>
                                        </div>

                                        <div className="space-y-4">
                                            {/* HASHTAGS */}
                                            <div className="bg-gradient-to-r from-pink-500/20 to-purple-500/20 rounded-xl p-6 border border-pink-500/30">
                                                <h3 className="text-white font-bold mb-3 flex items-center gap-2">
                                                    <Hash className="w-5 h-5" />
                                                    Hashtags pour vos réseaux
                                                </h3>
                                                <div className="bg-black/30 rounded-lg p-4 mb-3 max-h-40 overflow-y-auto">
                                                    <p className="text-white/90 text-sm leading-relaxed">
                                                        {hashtags.join(' ')}
                                                    </p>
                                                </div>
                                                <button
                                                    onClick={copyHashtags}
                                                    className="w-full bg-purple-500 hover:bg-purple-600 text-white py-3 rounded-lg font-semibold transition-all"
                                                >
                                                    📋 Copier tous les hashtags
                                                </button>
                                            </div>

                                            {/* INFOS VIDEO */}
                                            <div className="bg-white/5 rounded-xl p-6">
                                                <h3 className="text-white font-bold mb-3">📊 Informations</h3>
                                                <div className="space-y-2 text-white/80 text-sm">
                                                    <p>📹 <strong>Format:</strong> WebM (compatible tous logiciels)</p>
                                                    <p>⏱️ <strong>Durée:</strong> {formatTime(duration)}</p>
                                                    <p>🎨 <strong>Filtre:</strong> {selectedFilter === 'none' ? 'Aucun' : selectedFilter}</p>
                                                    <p>📝 <strong>Titre:</strong> {videoTitle || 'Sans titre'}</p>
                                                </div>
                                            </div>

                                            {/* PLATEFORMES */}
                                            <div className="bg-gradient-to-r from-blue-500/20 to-cyan-500/20 rounded-xl p-6 border border-blue-500/30">
                                                <h3 className="text-white font-bold mb-3">🚀 Où partager ?</h3>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div className="bg-black/30 rounded-lg p-3 text-center">
                                                        <p className="text-2xl mb-1">📱</p>
                                                        <p className="text-white text-sm font-semibold">TikTok</p>
                                                    </div>
                                                    <div className="bg-black/30 rounded-lg p-3 text-center">
                                                        <p className="text-2xl mb-1">📸</p>
                                                        <p className="text-white text-sm font-semibold">Instagram Reels</p>
                                                    </div>
                                                    <div className="bg-black/30 rounded-lg p-3 text-center">
                                                        <p className="text-2xl mb-1">▶️</p>
                                                        <p className="text-white text-sm font-semibold">YouTube Shorts</p>
                                                    </div>
                                                    <div className="bg-black/30 rounded-lg p-3 text-center">
                                                        <p className="text-2xl mb-1">👤</p>
                                                        <p className="text-white text-sm font-semibold">Facebook</p>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* NOUVEAU PROJET */}
                                            <button
                                                onClick={() => {
                                                    if (videoUrl) URL.revokeObjectURL(videoUrl);
                                                    setVideoUrl(null);
                                                    setRecordedChunks([]);
                                                    setDuration(0);
                                                    setVideoTitle('');
                                                    setTextOverlay('');
                                                    setSelectedFilter('none');
                                                    setBrightness(100);
                                                    setContrast(100);
                                                    setSaturation(100);
                                                    setActiveTab('record');
                                                }}
                                                className="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl font-semibold transition-all"
                                            >
                                                🎬 Nouveau projet
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* FOOTER INFO */}
                        <div className="mt-6 text-center text-white/50 text-sm">
                            <p>💡 Studio vidéo tout-en-un pour créer du contenu viral</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<VideoStudio />, document.getElementById('root'));
    </script>
</body>
</html>
