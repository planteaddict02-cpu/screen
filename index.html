<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistreur d'Écran pour Montage Vidéo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // Icônes SVG
        const Monitor = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
        );
        
        const Mic = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
        );
        
        const Square = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            </svg>
        );
        
        const Download = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
        );
        
        const Play = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
        );
        
        const Pause = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="6" y="4" width="4" height="16"/>
                <rect x="14" y="4" width="4" height="16"/>
            </svg>
        );
        
        const Trash2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
        );

        const Film = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
                <line x1="7" y1="2" x2="7" y2="22"/>
                <line x1="17" y1="2" x2="17" y2="22"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <line x1="2" y1="7" x2="7" y2="7"/>
                <line x1="2" y1="17" x2="7" y2="17"/>
                <line x1="17" y1="17" x2="22" y2="17"/>
                <line x1="17" y1="7" x2="22" y2="7"/>
            </svg>
        );

        function ScreenRecorder() {
            const [recording, setRecording] = useState(false);
            const [paused, setPaused] = useState(false);
            const [recordedChunks, setRecordedChunks] = useState([]);
            const [videoUrl, setVideoUrl] = useState(null);
            const [duration, setDuration] = useState(0);
            const [micEnabled, setMicEnabled] = useState(true);
            const [systemAudioEnabled, setSystemAudioEnabled] = useState(true);
            
            const mediaRecorderRef = useRef(null);
            const timerRef = useRef(null);
            const videoRef = useRef(null);

            useEffect(() => {
                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                    if (videoUrl) URL.revokeObjectURL(videoUrl);
                };
            }, [videoUrl]);

            const startRecording = async () => {
                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { mediaSource: 'screen' },
                        audio: systemAudioEnabled
                    });

                    let audioStream = null;
                    if (micEnabled) {
                        try {
                            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        } catch (err) {
                            console.log('Microphone non accessible:', err);
                        }
                    }

                    const tracks = [...screenStream.getTracks()];
                    if (audioStream) {
                        tracks.push(...audioStream.getTracks());
                    }

                    const combinedStream = new MediaStream(tracks);

                    const options = { mimeType: 'video/webm;codecs=vp9' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options.mimeType = 'video/webm';
                    }

                    const mediaRecorder = new MediaRecorder(combinedStream, options);
                    mediaRecorderRef.current = mediaRecorder;

                    const chunks = [];
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            chunks.push(e.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        setVideoUrl(url);
                        setRecordedChunks(chunks);
                        
                        tracks.forEach(track => track.stop());
                        if (timerRef.current) {
                            clearInterval(timerRef.current);
                        }
                    };

                    screenStream.getVideoTracks()[0].onended = () => {
                        stopRecording();
                    };

                    mediaRecorder.start(100);
                    setRecording(true);
                    setPaused(false);
                    setDuration(0);

                    timerRef.current = setInterval(() => {
                        setDuration(d => d + 1);
                    }, 1000);

                } catch (err) {
                    console.error('Erreur lors du démarrage:', err);
                    alert('Impossible de démarrer l\'enregistrement. Assurez-vous d\'autoriser l\'accès à l\'écran.');
                }
            };

            const pauseRecording = () => {
                if (mediaRecorderRef.current && recording) {
                    if (paused) {
                        mediaRecorderRef.current.resume();
                        timerRef.current = setInterval(() => {
                            setDuration(d => d + 1);
                        }, 1000);
                    } else {
                        mediaRecorderRef.current.pause();
                        if (timerRef.current) clearInterval(timerRef.current);
                    }
                    setPaused(!paused);
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && recording) {
                    mediaRecorderRef.current.stop();
                    setRecording(false);
                    setPaused(false);
                    if (timerRef.current) {
                        clearInterval(timerRef.current);
                    }
                }
            };

            const downloadVideo = async () => {
                if (videoUrl) {
                    try {
                        if ('showSaveFilePicker' in window) {
                            const blob = new Blob(recordedChunks, { type: 'video/webm' });
                            const handle = await window.showSaveFilePicker({
                                suggestedName: `montage-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.webm`,
                                types: [{
                                    description: 'Vidéo WebM',
                                    accept: { 'video/webm': ['.webm'] }
                                }]
                            });
                            const writable = await handle.createWritable();
                            await writable.write(blob);
                            await writable.close();
                            alert('✅ Vidéo enregistrée avec succès ! Prête pour le montage 🎬');
                        } else {
                            const a = document.createElement('a');
                            a.href = videoUrl;
                            a.download = `montage-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.webm`;
                            a.click();
                        }
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.error('Erreur lors de la sauvegarde:', err);
                            alert('❌ Erreur lors de la sauvegarde du fichier');
                        }
                    }
                }
            };

            const resetRecording = () => {
                if (videoUrl) URL.revokeObjectURL(videoUrl);
                setVideoUrl(null);
                setRecordedChunks([]);
                setDuration(0);
            };

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h > 0 ? h.toString().padStart(2, '0') + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900 p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20">
                            <h1 className="text-4xl font-bold text-white mb-2 text-center flex items-center justify-center gap-3">
                                <Film className="w-10 h-10" />
                                Enregistreur d'Écran pour Montage
                            </h1>
                            <p className="text-center text-white/70 mb-8 text-sm">
                                🎬 Parfait pour TikTok, Reels, YouTube Shorts
                            </p>

                            {!recording && !videoUrl && (
                                <div className="mb-6 space-y-4">
                                    <div className="flex items-center gap-3 bg-white/5 p-4 rounded-lg hover:bg-white/10 transition-colors">
                                        <input
                                            type="checkbox"
                                            id="systemAudio"
                                            checked={systemAudioEnabled}
                                            onChange={(e) => setSystemAudioEnabled(e.target.checked)}
                                            className="w-5 h-5 cursor-pointer"
                                        />
                                        <label htmlFor="systemAudio" className="text-white text-lg cursor-pointer flex items-center gap-2 flex-1">
                                            <Monitor className="w-5 h-5" />
                                            <span>Enregistrer le son du système</span>
                                            <span className="text-xs text-white/60 ml-auto">Musique, audio des vidéos</span>
                                        </label>
                                    </div>

                                    <div className="flex items-center gap-3 bg-white/5 p-4 rounded-lg hover:bg-white/10 transition-colors">
                                        <input
                                            type="checkbox"
                                            id="microphone"
                                            checked={micEnabled}
                                            onChange={(e) => setMicEnabled(e.target.checked)}
                                            className="w-5 h-5 cursor-pointer"
                                        />
                                        <label htmlFor="microphone" className="text-white text-lg cursor-pointer flex items-center gap-2 flex-1">
                                            <Mic className="w-5 h-5" />
                                            <span>Enregistrer le microphone</span>
                                            <span className="text-xs text-white/60 ml-auto">Voix-off, commentaires</span>
                                        </label>
                                    </div>
                                </div>
                            )}

                            {recording && (
                                <div className="text-center mb-6">
                                    <div className="inline-flex items-center gap-3 bg-red-500/20 border-2 border-red-500 rounded-full px-6 py-3">
                                        <div className="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                                        <span className="text-white text-2xl font-mono font-bold">
                                            {formatTime(duration)}
                                        </span>
                                    </div>
                                    {paused && (
                                        <p className="text-yellow-300 mt-2 text-sm">⏸️ En pause</p>
                                    )}
                                </div>
                            )}

                            <div className="flex gap-4 justify-center mb-8 flex-wrap">
                                {!recording && !videoUrl && (
                                    <button
                                        onClick={startRecording}
                                        className="bg-red-500 hover:bg-red-600 text-white px-8 py-4 rounded-full font-semibold text-lg transition-all transform hover:scale-105 flex items-center gap-2 shadow-lg"
                                    >
                                        <Monitor className="w-6 h-6" />
                                        Démarrer l'enregistrement
                                    </button>
                                )}

                                {recording && (
                                    <>
                                        <button
                                            onClick={pauseRecording}
                                            className="bg-yellow-500 hover:bg-yellow-600 text-white px-6 py-4 rounded-full font-semibold transition-all transform hover:scale-105 flex items-center gap-2 shadow-lg"
                                        >
                                            {paused ? <Play className="w-5 h-5" /> : <Pause className="w-5 h-5" />}
                                            {paused ? 'Reprendre' : 'Pause'}
                                        </button>

                                        <button
                                            onClick={stopRecording}
                                            className="bg-gray-700 hover:bg-gray-800 text-white px-6 py-4 rounded-full font-semibold transition-all transform hover:scale-105 flex items-center gap-2 shadow-lg"
                                        >
                                            <Square className="w-5 h-5" />
                                            Arrêter
                                        </button>
                                    </>
                                )}

                                {videoUrl && (
                                    <>
                                        <button
                                            onClick={downloadVideo}
                                            className="bg-green-500 hover:bg-green-600 text-white px-6 py-4 rounded-full font-semibold transition-all transform hover:scale-105 flex items-center gap-2 shadow-lg"
                                        >
                                            <Download className="w-5 h-5" />
                                            💾 Enregistrer la vidéo
                                        </button>

                                        <button
                                            onClick={resetRecording}
                                            className="bg-red-500 hover:bg-red-600 text-white px-6 py-4 rounded-full font-semibold transition-all transform hover:scale-105 flex items-center gap-2 shadow-lg"
                                        >
                                            <Trash2 className="w-5 h-5" />
                                            Nouveau
                                        </button>
                                    </>
                                )}
                            </div>

                            {videoUrl && (
                                <div className="bg-black/30 rounded-xl overflow-hidden">
                                    <video
                                        ref={videoRef}
                                        src={videoUrl}
                                        controls
                                        className="w-full"
                                    />
                                    <div className="p-4 text-white text-center bg-gradient-to-r from-purple-500/20 to-blue-500/20">
                                        <p className="text-sm opacity-90 flex items-center justify-center gap-2">
                                            <Film className="w-4 h-4" />
                                            Durée: {formatTime(duration)} | Prêt pour le montage 🎬
                                        </p>
                                    </div>
                                </div>
                            )}

                            {!recording && !videoUrl && (
                                <div className="mt-8 space-y-4">
                                    <div className="bg-gradient-to-r from-purple-500/20 to-pink-500/20 rounded-xl p-6 text-white border border-purple-500/30">
                                        <h3 className="font-bold mb-3 text-lg flex items-center gap-2">
                                            <Film className="w-5 h-5" />
                                            Instructions pour créer vos montages
                                        </h3>
                                        <ul className="space-y-2 text-sm text-white/90">
                                            <li>• ✅ <strong>Son système</strong>: capturez la musique de vos vidéos (ex: "Quelque chose dans mon coeur")</li>
                                            <li>• 🎤 <strong>Microphone</strong>: ajoutez votre voix-off ou commentaires</li>
                                            <li>• 🖥️ <strong>Démarrer</strong>: sélectionnez la fenêtre ou l'écran complet</li>
                                            <li>• ⏸️ <strong>Pause</strong>: coupez entre différentes séquences</li>
                                            <li>• 💾 <strong>Format WebM</strong>: compatible avec tous les logiciels de montage</li>
                                        </ul>
                                    </div>

                                    <div className="bg-gradient-to-r from-blue-500/20 to-cyan-500/20 rounded-xl p-6 text-white border border-blue-500/30">
                                        <h3 className="font-bold mb-3 text-lg flex items-center gap-2">
                                            💡 Workflow de montage recommandé
                                        </h3>
                                        <div className="space-y-3 text-sm">
                                            <div className="flex items-start gap-3">
                                                <span className="bg-blue-500 text-white w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 text-xs font-bold">1</span>
                                                <p><strong>Enregistrez</strong> vos séquences avec cet outil</p>
                                            </div>
                                            <div className="flex items-start gap-3">
                                                <span className="bg-blue-500 text-white w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 text-xs font-bold">2</span>
                                                <p><strong>Importez</strong> dans CapCut, Premiere Pro, DaVinci Resolve, iMovie ou Final Cut</p>
                                            </div>
                                            <div className="flex items-start gap-3">
                                                <span className="bg-blue-500 text-white w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 text-xs font-bold">3</span>
                                                <p><strong>Montez</strong>: ajoutez effets, transitions, textes et filtres</p>
                                            </div>
                                            <div className="flex items-start gap-3">
                                                <span className="bg-blue-500 text-white w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 text-xs font-bold">4</span>
                                                <p><strong>Exportez</strong> pour TikTok, Reels, YouTube Shorts</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-r from-pink-500/20 to-red-500/20 rounded-xl p-6 text-white border border-pink-500/30">
                                        <h3 className="font-bold mb-3 text-lg">🎯 Parfait pour</h3>
                                        <div className="grid grid-cols-2 gap-3 text-sm">
                                            <div className="bg-white/10 rounded-lg p-3">
                                                <p className="font-semibold mb-1">🎵 Clips musicaux</p>
                                                <p className="text-xs text-white/70">Nostalgie années 90</p>
                                            </div>
                                            <div className="bg-white/10 rounded-lg p-3">
                                                <p className="font-semibold mb-1">🎬 Comédies</p>
                                                <p className="text-xs text-white/70">La Smala, Trip HLM</p>
                                            </div>
                                            <div className="bg-white/10 rounded-lg p-3">
                                                <p className="font-semibold mb-1">📱 Stories & Reels</p>
                                                <p className="text-xs text-white/70">Format vertical</p>
                                            </div>
                                            <div className="bg-white/10 rounded-lg p-3">
                                                <p className="font-semibold mb-1">🎮 Gaming</p>
                                                <p className="text-xs text-white/70">Captures d'écran</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ScreenRecorder />, document.getElementById('root'));
    </script>
</body>
</html>
